<div class="ps-wrap settings-card">
  <h2 class="settings-title">Price Distributor</h2>
  <p class="settings-desc">Split a project's money using your percentages. Tap any percentage to change it.</p>
  <div class="form-grid">
    <div class="form-field"><label>Project price (₹)</label><input type="number" id="psTotal" min="0"></div>
    <div class="form-field"><label>Or pick a project</label><select id="psProject"></select></div>
    <div class="form-field"><label>Crew members</label><input type="number" id="psCrew" min="1"></div>
    <div class="form-field"><label>Client came via referral?</label><select id="psRef"><option value="0">No — client came directly</option><option value="1">Yes — pay referral</option></select></div>
  </div>
  <div id="psRows"></div>
  <div class="form-actions"><button class="btn btn-ghost btn-sm" id="psReset">Reset to PDF defaults</button></div>
</div>
