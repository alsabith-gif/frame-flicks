<section class="feedback-page">
  <p class="fb-intro">Messages from your crew. You can see the <b>date</b> and an optional mood — the app does not save who wrote them.</p>
  <div class="fb-notice" id="fbNotice" style="display:none;"></div>
  <div class="fb-toolbar"><span id="fbCount"></span> <button type="button" class="btn btn-ghost btn-sm" id="fbRefresh">↻ Refresh</button></div>
  <div id="fbList"></div>
  <div class="empty-state" id="fbEmpty" style="display:none;">
    <div class="icon">💬</div>
    <p>No feedback yet. Workers can send it from their Profile tab.</p>
  </div>
</section>
