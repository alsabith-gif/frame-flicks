<section class="workers-page">
  <p class="wk-intro">Give each crew member their own login. They see only their own jobs and pay — nothing else in the app.</p>
  <div class="wk-notice" id="wkNotice" style="display:none;"></div>
  <div id="wkList"></div>
  <div class="empty-state" id="wkEmpty" style="display:none;">
    <div class="icon">👷</div>
    <p>No workers yet. Tap <b>+ Add Worker</b> to invite your first camera person or editor — they'll get an email with a 6-digit code to log in.</p>
  </div>

  <section class="wk-jobs-wrap" id="wkJobsWrap">
    <div class="wk-jobs-head">
      <h2 class="wk-h2">Crew jobs</h2>
      <span class="wk-owed-total" id="wkOwedTotal"></span>
      <span class="wk-updated" id="wkUpdated"></span>
      <button type="button" class="btn btn-ghost btn-sm" id="wkJobsRefresh">↻ Refresh</button>
    </div>
    <div class="wk-filters" id="wkFilters"></div>
    <div id="wkJobs"></div>
  </section>
</section>
